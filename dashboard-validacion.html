<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard de Validación Remota</title>
  <style>
    body { font-family: sans-serif; background: #f9f9f9; padding: 2em; }
    h1 { color: #333; }
    table { border-collapse: collapse; width: 100%; margin-top: 1em; }
    th, td { border: 1px solid #ccc; padding: 0.5em; text-align: left; }
    th { background: #eee; }
    .ok { color: green; font-weight: bold; }
    .error { color: red; font-weight: bold; }
    .badge { height: 20px; }
  </style>
</head>
<body>
  <h1>📊 Dashboard de Validación Remota</h1>
  <table>
    <thead>
      <tr>
        <th>Ruta</th>
        <th>Estado</th>
        <th>Tienda</th>
        <th>Badge</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>exports/onboarding/onboarding.log</td>
        <td class="ok">✅ OK</td>
        <td>Híbrida</td>
        <td><img class="badge" src="https://img.shields.io/badge/exports-onboarding-onboarding-log-%E2%9C%85%20OK-brightgreen.svg"></td>
      </tr>
      <tr>
        <td>badge-deploy.svg</td>
        <td class="ok">✅ OK</td>
        <td>Demo</td>
        <td><img class="badge" src="https://img.shields.io/badge/badge-deploy-svg-%E2%9C%85%20OK-brightgreen.svg"></td>
      </tr>
      <tr>
        <td>data/inventario.json</td>
        <td class="ok">✅ OK</td>
        <td>Online</td>
        <td><img class="badge" src="https://img.shields.io/badge/data-inventario-json-%E2%9C%85%20OK-brightgreen.svg"></td>
      </tr>
      <tr>
        <td>data/flujo-caja.json</td>
        <td class="ok">✅ OK</td>
        <td>Física</td>
        <td><img class="badge" src="https://img.shields.io/badge/data-flujo-caja-json-%E2%9C%85%20OK-brightgreen.svg"></td>
      </tr>
      <tr>
        <td>index.html</td>
        <td class="ok">✅ OK</td>
        <td>Demo</td>
        <td><img class="badge" src="https://img.shields.io/badge/index-html-%E2%9C%85%20OK-brightgreen.svg"></td>
      </tr>
    </tbody>
  </table>
</body>
</html>
