<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>ComercialX Cockpit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
<style>

  .fail { color: red; font-weight: bold; }

</style>
</head>
<body>
  <h1>🚀 ComercialX Cockpit</h1>
  <p>Resumen técnico por módulo, entorno y operación.</p>

  <div id="resumen"></div>

  <div class="enlaces-globales">
    <a href="visor-comunitario.html" target="_blank">🔍 Visor</a>
    <a href="log-monitor.html" target="_blank">📘 Log</a>
    <a href="embed-docker.html" target="_blank">📎 Docker</a>
  </div>

  <script>
    fetch('dashboard-maestro.json')
      .then(res => res.json())
      .then(json => {
        const contenedor = document.getElementById('resumen');
        json.modulos.forEach(m => {
          const div = document.createElement('div');
          div.className = "modulo";
          div.innerHTML = `
            <h2>${m.nombre} <img class="badge" src="${m.badge}" alt="badge" /></h2>
            <p><strong>Tienda:</strong> ${m.tienda} | <strong>Entorno:</strong> ${m.entorno}</p>
            <div class="links">
              <a href="${m.ruta}" target="_blank">🔍 Visor</a>
              <a href="${m.log}" target="_blank">📘 Log</a>
              <a href="${m.embed}" target="_blank">📎 Embed</a>
            </div>
          `;
          contenedor.appendChild(div);
        });
      });
  </script>
<h2>🛠️ Monitor de Deploy – ComercialX</h2>

</body>
</html>
