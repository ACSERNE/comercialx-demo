<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>ComercialX Cockpit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: sans-serif; padding: 2rem; background: #fff; }
    h1 { color: #2c3e50; }
    .modulo { border: 1px solid #ccc; padding: 1rem; margin: 1rem 0; }
    .badge { float: right; }
    .links a { margin-right: 1rem; }
  </style>
</head>
<body>
  <h1>🚀 ComercialX Cockpit</h1>
  <p>Resumen técnico por módulo, entorno y operación.</p>

  <div id="resumen"></div>

  <script>
    fetch('dashboard-maestro.json')
      .then(res => res.json())
      .then(json => {
        const contenedor = document.getElementById('resumen');
        json.modulos.forEach(m => {
          const div = document.createElement('div');
          div.className = "modulo";
          div.innerHTML = `
            <h2>${m.nombre} <img class="badge" src="${m.badge}" alt="badge" /></h2>
            <p><strong>Tienda:</strong> ${m.tienda} | <strong>Entorno:</strong> ${m.entorno}</p>
            <div class="links">
              <a href="${m.ruta}" target="_blank">🔍 Visor</a>
              <a href="${m.log}" target="_blank">📘 Log</a>
              <a href="${m.embed}" target="_blank">📎 Embed</a>
            </div>
          `;
          contenedor.appendChild(div);
        });
      });
  </script>
</body>
</html>
