<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Comunitario: Auditoría Federada</title>
  <style>
    body { font-family: sans-serif; padding: 1rem; background: #f0f0f0; }
    h1 { margin-bottom: 0.5rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; background: #fff; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
    th { background: #eee; }
    button { padding: 0.4rem 0.8rem; margin: 1rem 0; }
  </style>
</head>
<body>
  <h1>Dashboard Comunitario: Auditoría Federada</h1>
  <p>🔄 Validar todas las tiendas &nbsp; 📤 <button id="exportarCSV">Exportar CSV</button></p>

  <table id="tablaAuditoria">
    <thead>
      <tr>
        <th>Ruta</th>
        <th>Tipo</th>
        <th>Estado</th>
        <th>Tienda</th>
        <th>Entorno</th>
        <th>Badge</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>index.html</td>
        <td>html</td>
        <td>✅ OK</td>
        <td>demo</td>
        <td>demo</td>
        <td></td>
      </tr>
      <tr>
        <td>badge-deploy.svg</td>
        <td>svg</td>
        <td>✅ OK</td>
        <td>demo</td>
        <td>demo</td>
        <td><img src="badge-deploy.svg" alt="Badge deploy" height="20"></td>
      </tr>
      <tr>
        <td>data/inventario.json</td>
        <td>json</td>
        <td>✅ OK</td>
        <td>demo</td>
        <td>demo</td>
        <td></td>
      </tr>
    </tbody>
  </table>

  <script>
    // 📤 Exportador CSV cockpitizado
    document.getElementById("exportarCSV").addEventListener("click", () => {
      const filas = Array.from(document.querySelectorAll("#tablaAuditoria tbody tr"));
      const encabezados = Array.from(document.querySelectorAll("#tablaAuditoria thead th")).map(th => th.textContent.trim());
      const datos = filas.map(tr =>
        Array.from(tr.querySelectorAll("td")).map(td => td.textContent.trim())
      );

      let csv = encabezados.join(",") + "\n";
      datos.forEach(row => {
        csv += row.map(val => `"${val}"`).join(",") + "\n";
      });

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "auditoria-dashboard.csv";
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
