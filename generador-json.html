<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador de validador-rutas.json</title>
  <style>
    body { font-family: sans-serif; padding: 1rem; background: #fdfdfd; }
    textarea { width: 100%; height: 200px; margin-top: 1rem; }
    button { padding: 0.5rem 1rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>🧬 Generador de validador-rutas.json</h1>
  <p>Extrae rutas del dashboard y genera JSON validable.</p>
  <button onclick="generarJSON()">🔄 Generar JSON</button>
  <textarea id="output" readonly></textarea>

  <script>
    const rutas = [
      "index.html",
      "badge-deploy.svg",
      "data/inventario.json",
      "data/errores.json",
      "dashboard-comunitario.html",
      "generador-badges.html",
      "exportador-csv.js",
      "validador.html",
      "visor-estado.html"
    ];

    function generarJSON() {
      const json = JSON.stringify(rutas, null, 2);
      document.getElementById("output").value = json;
    }
  </script>
</body>
</html>
