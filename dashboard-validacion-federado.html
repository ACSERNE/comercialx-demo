<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Federado de Validación Remota</title>
  <style>
    body { font-family: sans-serif; background: #f0f0f0; padding: 2em; }
    h1 { color: #333; }
    table { border-collapse: collapse; width: 100%; margin-top: 1em; }
    th, td { border: 1px solid #ccc; padding: 0.5em; text-align: left; }
    th { background: #eee; }
    .ok { color: green; font-weight: bold; }
    .error { color: red; font-weight: bold; }
    .badge { height: 20px; }
    select, button { margin: 1em 0; padding: 0.5em; }
  </style>
</head>
<body>
  <h1>📡 Dashboard Federado de Validación Remota</h1>

  <label for="filtro">🧭 Filtrar por tienda:</label>
  <select id="filtro">
    <option value="todas">Todas</option>
    <option value="demo">Demo</option>
    <option value="online">Online</option>
    <option value="fisica">Física</option>
    <option value="hibrida">Híbrida</option>
  </select>

  <button onclick="revalidar()">🔄 Revalidar rutas</button>
  <button onclick="exportarCSV()">📤 Exportar CSV</button>

  <table id="tabla">
    <thead>
      <tr>
        <th>Ruta</th>
        <th>Estado</th>
        <th>Tienda</th>
        <th>Badge</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
const rutas = [
  { ruta: 'exports/onboarding/onboarding.log', tienda: 'hibrida' },
  { ruta: 'badge-deploy.svg', tienda: 'demo' },
  { ruta: 'data/inventario.json', tienda: 'online' },
  { ruta: 'data/flujo-caja.json', tienda: 'fisica' },
  { ruta: 'index.html', tienda: 'demo' }
];

const baseURL = 'https://acserne.github.io/comercialx-demo/';
let resultados = [];

async function validarRuta({ ruta, tienda }) {
  const url = baseURL + ruta;
  try {
    const res = await fetch(url);
    const estado = res.status === 200 ? '✅ OK' : '❌ Error';
    const badge = `https://img.shields.io/badge/${ruta.replace(/\W+/g, '-')}-${encodeURIComponent(estado)}-${estado === '✅ OK' ? 'brightgreen' : 'red'}.svg`;
    resultados.push({ ruta, estado, tienda, badge, timestamp: new Date().toISOString() });
  } catch {
    const estado = '❌ Error';
    const badge = `https://img.shields.io/badge/${ruta.replace(/\W+/g, '-')}-${encodeURIComponent(estado)}-red.svg`;
    resultados.push({ ruta, estado, tienda, badge, timestamp: new Date().toISOString() });
  }
}

async function revalidar() {
  resultados = [];
  document.querySelector('tbody').innerHTML = '';
  for (const r of rutas) await validarRuta(r);
  renderizar();
}

function renderizar() {
  const filtro = document.getElementById('filtro').value;
  const tbody = document.querySelector('tbody');
  tbody.innerHTML = '';
  resultados
    .filter(r => filtro === 'todas' || r.tienda === filtro)
    .forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${r.ruta}</td>
        <td class="${r.estado.includes('OK') ? 'ok' : 'error'}">${r.estado}</td>
        <td>${r.tienda}</td>
        <td><img class="badge" src="${r.badge}"></td>
      `;
      tbody.appendChild(tr);
    });
}

function exportarCSV() {
  const encabezado = 'Ruta,Estado,Tienda,Timestamp\n';
  const filas = resultados.map(r => `${r.ruta},${r.estado},${r.tienda},${r.timestamp}`).join('\n');
  const blob = new Blob([encabezado + filas], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'validacion-remota.csv';
  a.click();
  URL.revokeObjectURL(url);
}

revalidar();
</script>
</body>
</html>
