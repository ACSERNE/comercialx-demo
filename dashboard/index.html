<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Visor Cockpitizado ComercialX</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f4; padding: 2em; }
    h1 { color: #333; }
    .badge-grid { display: flex; gap: 2em; flex-wrap: wrap; }
    .badge-item { text-align: center; background: #fff; padding: 1em; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
    .badge-item img { height: 40px; }
    .badge-item p { margin: 0.5em 0 0; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🏁 Estado de Validación por País</h1>
  <div class="badge-grid">
    <div class="badge-item">
      <img src="badges/CL.svg" alt="CL Badge">
      <p>Chile</p>
    </div>
    <div class="badge-item">
      <img src="badges/MX.svg" alt="MX Badge">
      <p>México</p>
    </div>
    <div class="badge-item">
      <img src="badges/ES.svg" alt="ES Badge">
      <p>España</p>
    </div>
  </div>

  <h2>📄 Exportación técnica</h2>
  <ul>
    <li><a href="../build-status.csv">Ver estado técnico CSV</a></li>
    <li><a href="../logs/CL.json">Log Chile</a></li>
    <li><a href="../logs/MX.json">Log México</a></li>
    <li><a href="../logs/ES.json">Log España</a></li>
  </ul>
</body>
</html>
